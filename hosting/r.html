<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#f4f5f7;color:#374151;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:16px;text-align:center}a{color:#2563eb}</style>
</head>
<body>
<p id="msg">Redirecting…</p>
<script src="/js/public.js"></script>
<script>
(async () => {
  const { params, isToken, get, create } = PublicFS;
  const t = params.get('t');
  const k = params.get('k');
  const msg = document.getElementById('msg');
  if (!isToken(t) || !isToken(k)) { msg.textContent = 'This link is invalid.'; return; }
  const link = await get('links/' + k).catch(() => null);
  if (!link || !/^https?:\/\//i.test(link.url || '')) { msg.textContent = 'This link has expired.'; return; }
  try { await Promise.race([create('clicks', { token: t, k, created_at: new Date().toISOString() }), new Promise((r) => setTimeout(r, 1500))]); } catch (e) { /* still redirect */ }
  location.replace(link.url);
})();
</script>
</body>
</html>
