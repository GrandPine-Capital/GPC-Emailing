<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f4f5f7;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:16px}
.card{background:#fff;padding:32px;border-radius:12px;max-width:440px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
button{background:#dc2626;color:#fff;border:0;padding:12px 24px;border-radius:8px;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
</style>
</head>
<body>
<div class="card" id="card">
  <h2>Unsubscribe</h2>
  <p>Stop receiving these emails?</p>
  <button id="go">Unsubscribe me</button>
  <p id="err" style="color:#dc2626"></p>
</div>
<script src="/js/public.js"></script>
<script>
const { params, isToken, create } = PublicFS;
const t = params.get('t');
const card = document.getElementById('card');
if (!isToken(t)) card.innerHTML = '<h2>Unsubscribe</h2><p>This link is a preview or has expired.</p>';
else document.getElementById('go').onclick = async (e) => {
  e.target.disabled = true;
  try {
    await create('unsubscribes', { token: t, created_at: new Date().toISOString() });
    card.innerHTML = "<h2>You're unsubscribed</h2><p>You will no longer receive these emails.</p>";
  } catch (err) {
    e.target.disabled = false;
    document.getElementById('err').textContent = 'Something went wrong, please try again or reply "unsubscribe" to the email.';
  }
};
</script>
</body>
</html>
