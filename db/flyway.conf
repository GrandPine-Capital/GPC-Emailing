# Flyway owns the schema. From the repository root:
#   flyway -configFiles=db/flyway.conf -url=jdbc:postgresql://localhost:5432/gpc_emailing -user=... -password=... migrate
# or `make migrate` against docker-compose's Postgres.
flyway.locations=filesystem:db/migration
flyway.validateMigrationNaming=true
# Never allow `flyway clean` against a emailing database.
flyway.cleanDisabled=true
